<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>hammerlight</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #111114; color: #e8e8ea; }
      header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #26262c; }
      label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
      select, button { font: inherit; font-size: 13px; }
      #status, #overlay { font-size: 12px; color: #9a9aa2; }
      #status.error, #overlay .error { color: #ff8a80; }
      #overlay code { user-select: all; color: #e8e8ea; }
      #port { width: 6em; font: inherit; font-size: 13px; }
      #stage { padding: 16px; }
      #stage canvas { width: 100%; height: auto; display: block; background: #0a0a0c; border-radius: 6px; }
    </style>
  </head>
  <body>
    <header>
      <label>MIDI input <select id="input"></select></label>
      <label>View
        <select id="mode">
          <option value="live">Live (notes rise)</option>
          <option value="replay">Replay take (notes fall)</option>
        </select>
      </label>
      <button id="clear">New take</button>
      <span id="status"></span>
      <label>OBS port <input id="port" type="number" min="1024" max="65535" /></label>
      <button id="apply-port">Apply</button>
      <span id="overlay"></span>
    </header>
    <div id="stage"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
